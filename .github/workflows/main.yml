name: UsersAPI CI/CD

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CloudGames.API.sln

      - name: Build
        run: dotnet build CloudGames.API.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CloudGames.API.sln

  docker:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da imagem
        run: |
          docker build -t paulohe/usersapi:${{ github.sha }} .

      - name: Push da imagem
        run: |
          docker push paulohe/usersapi:${{ github.sha }}
